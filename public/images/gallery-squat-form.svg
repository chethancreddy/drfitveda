<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 338" width="600" height="338">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="338" fill="url(#bg2)"/>
  <circle cx="300" cy="150" r="140" fill="url(#glow2)"/>

  <!-- Geometric grid lines -->
  <line x1="120" y1="230" x2="480" y2="230" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="300" y1="70" x2="300" y2="250" stroke="#334155" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Squat Biomechanics Graphic -->
  <g transform="translate(275, 105)" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="25" cy="10" r="7" fill="#38bdf8"/>
    <path d="M 25 18 L 18 42 L 35 55" />
    <path d="M 18 42 L 5 62 L 18 72" />
    <path d="M 35 55 L 42 72" stroke="#818cf8" stroke-width="3"/>
  </g>

  <!-- Overlay Info Badge -->
  <rect x="24" y="24" width="94" height="28" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1"/>
  <text x="71" y="42" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">WORKOUT</text>

  <!-- Title banner -->
  <text x="300" y="270" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0.5">Squat Form &amp; Hip Mobility Check</text>
  <text x="300" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Biomechanics &amp; Knee Tracking Analysis</text>

  <!-- Play icon overlay -->
  <circle cx="300" cy="150" r="28" fill="#0f172a" fill-opacity="0.75" stroke="#ffffff" stroke-width="2"/>
  <polygon points="293,138 313,150 293,162" fill="#ffffff"/>
</svg>
